databases:
  - name: lpacamis-db
    databaseName: lpacamis
    user: lpacamis
    plan: free
    region: oregon

services:
  - type: web
    name: lpacamis-api
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lpacamis-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: CLIENT_ORIGINS
        sync: false
      - key: ALLOW_VERCEL_PREVIEWS
        value: "true"
