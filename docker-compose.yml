services:
  db:
    image: mysql:8
    container_name: lpareports-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: lpareports_root
      MYSQL_DATABASE: lpareports
      MYSQL_USER: lpareports
      MYSQL_PASSWORD: lpareports
    ports:
      - "3306:3306"
    volumes:
      - lpareports_mysql_data:/var/lib/mysql

volumes:
  lpareports_mysql_data:
